blueprint:
  name: "Paket Tracker: Benachrichtigung"
  description: >-
    Schickt eine Benachrichtigung, sobald ein Paket des Paket Trackers den Status
    wechselt oder gleich zugestellt wird – mit eigenem Text, eigenen Bedingungen und, für die Home-Assistant-App,
    einem Dashboard, das sich beim Antippen öffnet. Die Sendungsnummer, der
    Zustell-Code und der Ort stehen in keinem der voreingestellten Texte.
  domain: automation
  author: Sören Kaiser
  source_url: https://github.com/SoerenKaiser99/parcel_tracker/blob/main/blueprints/automation/parcel_tracker/paket_benachrichtigung.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    statuses:
      name: Status
      description: >-
        Bei welchen neuen Status benachrichtigt wird. „Bestellt“ gilt für Bestellungen
        bei einem Shop, „Angekündigt“ für Pakete eines Paketdienstes. „Kommt gleich“
        ist kein Status: Der Paketdienst kündigt die Zustellung in den nächsten Minuten
        an (DHL „wird gleich zugestellt“).
      default:
        - out_for_delivery
        - arriving_soon
        - awaiting_pickup
        - delivered
        - cancelled
      selector:
        select:
          multiple: true
          options:
            - label: Bestellt
              value: ordered
            - label: Angekündigt
              value: announced
            - label: Unterwegs
              value: in_transit
            - label: Im Zustelldepot
              value: at_delivery_depot
            - label: In Zustellung
              value: out_for_delivery
            - label: Kommt gleich
              value: arriving_soon
            - label: Abholbereit
              value: awaiting_pickup
            - label: Zugestellt
              value: delivered
            - label: Problem
              value: exception
            - label: Storniert
              value: cancelled
    notify_service:
      name: Benachrichtigungsdienst
      description: >-
        Klassischer Dienst, z. B. `notify.mobile_app_mein_handy` für die
        Home-Assistant-App oder `notify.notify` für alle eingerichteten Wege.
      default: notify.notify
      selector:
        text:
    title:
      name: Titel
      description: Überschrift der Benachrichtigung.
      default: Paket Tracker
      selector:
        text:
    message:
      name: Text
      description: >-
        Vorlage für den Text. Variablen: `name` (Name des Pakets, ohne Namen
        „Paket …“ und die letzten vier Stellen der Nummer), `carrier` (z. B. DHL),
        `new_status` und `old_status` (z. B. out_for_delivery, leer bei „Kommt
        gleich“), `event` (wie unter Status, z. B. ordered oder announced statt
        pre_transit, arriving_soon für „Kommt gleich“), `outgoing` (true bei
        einem versendeten Paket) sowie `text`
        (der fertige Standardsatz, z. B. „Kopfhörer (DHL) ist in Zustellung“).
      default: "{{ text }}"
      selector:
        template:
    dashboard_path:
      name: Dashboard-Pfad (nur Home-Assistant-App)
      description: >-
        Öffnet sich beim Antippen der Benachrichtigung, z. B. `/lovelace/pakete`.
        Leer lassen für andere Dienste (Telegram, Pushover, …).
      default: ""
      selector:
        text:
    replace_previous:
      name: Frühere Meldung ersetzen (nur Home-Assistant-App)
      description: >-
        Eine neue Benachrichtigung ersetzt die frühere zum selben Paket, statt sich
        darunter einzureihen. Als Kennung dient ein Hash der Sendungsnummer, nie die
        Nummer selbst.
      default: false
      selector:
        boolean:
    extra_conditions:
      name: Zusätzliche Bedingungen
      description: >-
        Nur benachrichtigen, wenn auch diese Bedingungen erfüllt sind, z. B. nur
        tagsüber oder nur, wenn jemand zu Hause ist.
      default: []
      selector:
        condition:

mode: queued
max: 10

triggers:
  - trigger: event
    event_type: parcel_tracker_status_changed
  # "Kommt gleich": no status change, an event of its own.
  - trigger: event
    event_type: parcel_tracker_arriving_soon

variables:
  statuses: !input statuses
  notify_service: !input notify_service
  dashboard_path: !input dashboard_path
  replace_previous: !input replace_previous
  # (empty for "Kommt gleich")
  new_status: "{{ trigger.event.data.new_status | default('') }}"
  old_status: "{{ trigger.event.data.old_status | default('') }}"
  # What to choose the change by: the status, but "ordered" (a shop's order) or
  # "announced" (a carrier's parcel) for "pre_transit". An event of an older version
  # carries no such field.
  event: "{{ trigger.event.data.get('event') or new_status }}"
  # A parcel the user sent (a DHL receipt of a handover): only its arrival is told.
  # An event of a version before 0.3.48 carries no such field.
  outgoing: "{{ trigger.event.data.outgoing | default(false) }}"
  name: >-
    {{ trigger.event.data.name
       or 'Paket …' ~ (trigger.event.data.number | string)[-4:] }}
  # The display name as on the sensor (`carrier_name`), e.g. DHL.
  carrier: "{{ trigger.event.data.carrier_name or '' }}"
  text: >-
    {% set label = name ~ (' (' ~ carrier ~ ')' if carrier else '') %}
    {% set phrases = {
      'ordered': 'wurde bestellt',
      'announced': 'ist angekündigt',
      'pre_transit': 'ist angekündigt',
      'in_transit': 'ist unterwegs',
      'at_delivery_depot': 'ist im Zustelldepot',
      'out_for_delivery': 'ist in Zustellung',
      'awaiting_pickup': 'liegt zur Abholung bereit',
      'delivered': 'wurde zugestellt',
      'cancelled': 'wurde storniert'} %}
    {% if outgoing and new_status == 'delivered' %}✅ Dein verschicktes Paket {{ label }} wurde zugestellt
    {%- elif outgoing %}✅ Dein verschicktes Paket {{ label }} liegt beim Empfänger zur Abholung bereit
    {%- elif new_status == 'exception' %}{{ label }}: Problem bei der Zustellung
    {%- elif event == 'arriving_soon' %}{{ label }} wird gleich zugestellt
    {{- ' – bis ' ~ (trigger.event.data.eta_to | as_datetime | as_local).strftime('%H:%M')
        ~ ' Uhr' if trigger.event.data.get('eta_to') else '' }}
    {%- else %}{{ label }} {{ phrases.get(event, 'hat einen neuen Status') }}
    {%- endif %}
  # Extras of the Home Assistant app: `url` (iOS) and `clickAction` (Android) open the
  # dashboard on tap, `tag` lets a later notification replace the earlier one.
  push_data: >-
    {{ dict(
         ({'url': dashboard_path, 'clickAction': dashboard_path} if dashboard_path else {}),
         **({'tag': 'parcel_tracker_' ~ (trigger.event.data.number | string | md5)}
            if replace_previous else {})) }}

conditions:
  # A sent parcel comes with "Zugestellt" chosen, like the built-in push.
  # An automation made before "Bestellt" and "Angekündigt" were two may hold the status
  # "pre_transit" ("Angekündigt" then): it stands for both.
  - condition: template
    value_template: >-
      {{ ('delivered' if outgoing else event) in statuses
         or (not outgoing and new_status == 'pre_transit' and 'pre_transit' in statuses) }}
  # A sent parcel: only its arrival at the recipient, once (ready for pickup and then
  # picked up is one arrival).
  - condition: template
    value_template: >-
      {{ not outgoing or (new_status in ['delivered', 'awaiting_pickup']
                          and old_status not in ['delivered', 'awaiting_pickup']) }}
  # A shop order closed without a delivery mail ("Abgeschlossen ohne
  # Zustellbestätigung"): nothing arrived just now, so nothing is announced.
  - condition: template
    value_template: "{{ not trigger.event.data.get('assumed', false) }}"
  # A parcel marked as received by hand ("Erhalten" on the card): whoever tapped it
  # knows, so nothing is announced.
  - condition: template
    value_template: "{{ not trigger.event.data.get('manual', false) }}"
  # The status was told for the parcel's box already (an order that took in a carrier's
  # parcel, a further order in the same box): the built-in push leaves it out as well.
  # An event of an older version carries no such field.
  - condition: template
    value_template: "{{ not trigger.event.data.get('repeat', false) }}"
  - condition: and
    conditions: !input extra_conditions

actions:
  - if: "{{ push_data | length > 0 }}"
    then:
      - action: "{{ notify_service }}"
        data:
          title: !input title
          message: !input message
          data: "{{ push_data }}"
    else:
      - action: "{{ notify_service }}"
        data:
          title: !input title
          message: !input message
