name: Mail wird nicht erkannt
description: Eine Paketmail landet in „Nicht erkannt“ oder ein Shop oder Carrier fehlt.
title: "[Mail] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Nie rohe Mails hochladen und Mails nie privat an den Autor schicken.**
        Angehängt werden nur Mails, die das Skript `anonymize_mail.py` bereinigt hat und die du danach selbst gelesen hast.
        Anleitung: https://github.com/SoerenKaiser99/parcel_tracker#beispielmails-einreichen
  - type: input
    id: sender
    attributes:
      label: Absender-Adresse
      description: Die Adresse des Shops oder Carriers, von der die Mail kommt – nicht deine eigene.
      placeholder: noreply@beispiel-carrier.de
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Land
      description: In welchem Land wurde bestellt bzw. zugestellt?
      placeholder: Deutschland
    validations:
      required: true
  - type: input
    id: shop
    attributes:
      label: Shop / Carrier
      description: Welcher Shop hat verschickt, welcher Carrier liefert?
      placeholder: Beispielshop, Versand mit GLS
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
      description: Was soll die Integration aus der Mail machen (Paket anlegen, Status, Liefertag, Zeitfenster)?
    validations:
      required: true
  - type: textarea
    id: mails
    attributes:
      label: ZIP mit anonymisierten Mails
      description: Die Datei paket-tracker-beispiele.zip aus dem Ordner „anonymisiert“ in dieses Feld ziehen.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Datenschutz
      options:
        - label: Ich habe keine rohen Mails angehängt
          required: true
        - label: Ich habe die anonymisierten Dateien selbst durchgelesen
          required: true
